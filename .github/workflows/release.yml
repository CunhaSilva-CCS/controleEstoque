name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependências nativas (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Instalar dependências
        run: npm ci

      - name: Validar antes do release
        run: |
          npm run typecheck
          npm test
          npm run smoke

      - name: Audit de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Preparar assinatura de código
        id: signing
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/ci-prepare-signing.mjs

      - name: Importar chave GPG (Linux)
        if: matrix.platform == 'linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "GPG não configurado — .deb sem assinatura"
            exit 0
          fi
          echo "$LINUX_GPG_PRIVATE_KEY" | base64 -d > /tmp/release-key.asc
          gpg --batch --import /tmp/release-key.asc
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "DEB_SIGN_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "GPG importado: $KEY_ID"

      - name: Empacotar instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run electron:build:release

      - name: Verificar assinatura (Windows)
        if: matrix.platform == 'win' && steps.signing.outputs.signing_enabled == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "Instalador .exe não encontrado" }
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Assinatura: $($sig.Status) — $($installer.Name)"
          if ($sig.Status -ne 'Valid') { throw "Assinatura inválida: $($sig.Status)" }

      - name: Verificar notarização (macOS)
        if: matrix.platform == 'mac' && steps.signing.outputs.signing_enabled == 'true'
        run: |
          DMG=$(find release -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then echo "DMG não encontrado"; exit 1; fi
          codesign -dv --verbose=2 "$DMG" 2>&1 | head -20
          if [ "${{ steps.signing.outputs.notarize_enabled }}" = "true" ]; then
            spctl -a -vv -t install "$DMG"
          else
            echo "Notarização não configurada — apenas codesign verificado"
          fi

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Gerar checksums SHA-256
        working-directory: artifacts
        run: find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Gerar SBOM CycloneDX
        run: npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: true
